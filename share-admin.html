<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--no-analytics-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Shared codes | Easy BACnet</title>
<meta name="description" content="Admin list.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14171a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --fg:#f3f5f6; --bg:#14171a; --muted:#9aa4ad;
          --accent:#ff9a1f; --box:#1d2227; --line:#2f363d; --code:#101418; --ink:#0d0f11; }
  * { box-sizing: border-box; }
  img { max-width:100%; height:auto; }
  body{overflow-wrap:break-word; max-width: 48rem; margin: 0 auto; padding: 2rem 1.25rem 5rem;
         font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         font-size:17px; line-height:1.7; color:var(--fg); background:var(--bg);
         -webkit-font-smoothing:antialiased; }
  header.site { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap;
                padding-bottom:1.25rem; border-bottom:1px solid var(--line); margin-bottom:2.25rem; }
  header.site a { color:var(--fg); text-decoration:none; }
  header.site .brand { font-family:"Archivo",sans-serif; font-weight:900;
                       text-transform:uppercase; letter-spacing:.02em; font-size:1.05rem; }
  header.site .muted { margin-left:auto; font-family:"IBM Plex Mono",ui-monospace,monospace;
                       font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; }
  h1, h2, h3 { font-family:"Archivo",sans-serif; letter-spacing:-.01em; line-height:1.12; }
  h1 { font-weight:900; text-transform:uppercase; font-size:clamp(1.7rem,4.5vw,2.5rem);
       margin:0 0 .6rem; }
  .updated { color:var(--muted); font-size:.8rem; margin:0 0 1.5rem;
             font-family:"IBM Plex Mono",ui-monospace,monospace; letter-spacing:.06em; }
  h2 { font-weight:800; font-size:1.35rem; margin:2.6rem 0 .6rem; }
  h3 { font-weight:800; font-size:1.06rem; margin:1.8rem 0 .4rem; }
  a { color:var(--accent); }
  strong { color:#fff; }
  .answer { background:var(--box); border:1px solid var(--line); border-left:3px solid var(--accent);
            border-radius:12px; padding:1.1rem 1.3rem; margin:1.5rem 0 2rem; }
  .answer > strong { display:block; margin-bottom:.5rem; text-transform:uppercase;
                   font-family:"IBM Plex Mono",ui-monospace,monospace; font-weight:600;
                   font-size:.72rem; letter-spacing:.18em; color:var(--accent); }
  .answer p { margin:.6rem 0; }
  .answer p strong { color:#fff; font-weight:700; }
  code { background:var(--code); padding:.1rem .4rem; border-radius:4px; font-size:.9em;
         font-family:"IBM Plex Mono",ui-monospace,monospace; }
  pre { background:var(--code); padding:1rem; border-radius:10px; overflow-x:auto;
        border:1px solid var(--line); }
  pre code { background:none; padding:0; }
  table { border-collapse:collapse; width:100%; margin:1.25rem 0; display:block; overflow-x:auto; }
  th, td { text-align:left; padding:.55rem .75rem; border-bottom:1px solid var(--line); }
  th { font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.72rem;
       text-transform:uppercase; letter-spacing:.1em; color:var(--accent); font-weight:600; }
  ul, ol { padding-left:1.3rem; }
  li { margin:.45rem 0; }
  .muted { color:var(--muted); font-size:.92rem; }
  nav.more { margin-top:3rem; padding-top:1.5rem; border-top:1px solid var(--line); }
  nav.more h2 { margin-top:0; }
  nav.more ul { list-style:none; padding:0; }
  nav.more li { margin:0; border-bottom:1px solid var(--line); padding:.85rem 0; }
  nav.more li:last-child { border-bottom:none; }
  nav.more a { font-family:"Archivo",sans-serif; font-weight:600; }
  footer { margin-top:3.5rem; padding-top:1.5rem; border-top:1px solid var(--line);
           color:var(--muted); font-size:.9rem; }
  footer a { color:var(--accent); }
  .shotkey { margin:.2rem 0 1.6rem; padding-left:1.1rem; font-size:.95rem; }
  .shotkey li { margin:.25rem 0; }
  .shotrow.big figure { flex:0 1 300px; }
  .shotrow { display:flex; flex-wrap:wrap; gap:1rem; margin:1.75rem 0; }
  .shotrow figure { margin:0; flex:0 1 200px; }
  .shotrow img { width:100%; height:auto; border:1px solid var(--line);
                 border-radius:16px; display:block; background:var(--ink); }
  .shotrow figcaption { color:var(--muted); font-size:.82rem; margin-top:.5rem;
                        text-align:center; line-height:1.35; }
  .callout { background:var(--box); border:1px solid var(--line);
             border-left:3px solid var(--accent); border-radius:12px;
             padding:1rem 1.25rem; margin:1.75rem 0; }
  .callout p:last-child { margin-bottom:0; }
  header.site .getapp { margin-left:.9rem; padding:.3rem .7rem; border-radius:8px;
                        background:var(--accent); color:var(--ink); font-weight:700;
                        font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:.7rem;
                        letter-spacing:.1em; text-transform:uppercase; }
  .appcta { background:var(--box); border:1px solid var(--line);
            border-left:3px solid var(--accent); border-radius:12px;
            padding:1.1rem 1.3rem; margin:2.5rem 0 0; display:flex; gap:1rem;
            align-items:center; flex-wrap:wrap; }
  .appcta p { margin:0; flex:1 1 18rem; }
  .appcta a.btn { background:var(--accent); color:var(--ink); text-decoration:none;
                  font-weight:700; padding:.6rem 1rem; border-radius:10px; white-space:nowrap; }
  /* Phones: the tagline wrapped onto its own line and the nav onto a third;
     the footer already links the points library. */
  @media (max-width:520px) {
    header.site .muted, header.site .navl { display:none; }
    header.site .getapp { margin-left:auto; }
    code { overflow-wrap:anywhere; }
  }

  figure.diagram { margin:2rem 0; background:#171b1f; border:1px solid var(--line);
                   border-radius:14px; padding:1rem 1rem .85rem; }
  figure.diagram svg { display:block; width:100%; height:auto; max-width:560px; margin:0 auto; }
  figure.diagram svg text { font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  figure.diagram svg .mono { font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace; }
  figure.diagram figcaption { color:var(--muted); font-size:.86rem; line-height:1.45;
                              margin-top:.75rem; text-align:center; }
  /* Phones: go edge to edge and keep labels readable; wide diagrams swipe. */
  @media (max-width: 520px) {
    figure.diagram { margin:1.75rem -1.25rem; border-radius:0; border-left:0; border-right:0;
                     padding:.85rem 0 .75rem; }
    figure.diagram .dg-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; padding:0 .75rem; }
    figure.diagram svg { min-width:480px; }
    figure.diagram figcaption { padding:0 1.25rem; }
    figure.diagram figcaption::after { content:" (swipe to see it all)"; opacity:.7; }
  }

  .tool { background:var(--box); border:1px solid var(--line); border-radius:14px;
          padding:1.3rem 1.4rem; margin:1.75rem 0; }
  .tool label { display:block; font-family:"IBM Plex Mono",ui-monospace,monospace;
                font-size:.72rem; text-transform:uppercase; letter-spacing:.12em;
                color:var(--accent); margin:.9rem 0 .3rem; }
  .tool input, .tool select { width:100%; padding:.6rem .7rem; font-size:1rem;
                font-family:"IBM Plex Mono",ui-monospace,monospace; color:var(--fg);
                background:var(--code); border:1px solid var(--line); border-radius:8px; }
  .tool .row { display:flex; gap:1rem; flex-wrap:wrap; }
  .tool .row > div { flex:1 1 160px; }
  .tool button { margin-top:1.1rem; padding:.6rem 1.2rem; font-family:"Archivo",sans-serif;
                font-weight:700; text-transform:uppercase; letter-spacing:.03em; font-size:.85rem;
                color:var(--ink); background:var(--accent); border:none; border-radius:8px;
                cursor:pointer; }
  .tool table { margin:1.3rem 0 0; }
  .tool .out-note { color:var(--muted); font-size:.85rem; margin-top:.8rem; }
  .tool hr { border:none; border-top:1px solid var(--line); margin:1.8rem 0; }

  body { max-width: 64rem; }
  .codebox { display:flex; gap:.6rem; flex-wrap:wrap; align-items:stretch; }
  .codebox input { flex:1 1 14rem; max-width:20rem; font-size:1.5rem; letter-spacing:.18em;
                   text-transform:uppercase; text-align:center; }
  .codebox button { margin-top:0; }
  .msg { margin-top:1rem; color:var(--muted); }
  .msg.err { color:#ff8a7a; }
  .folder { color:var(--muted); font-family:"IBM Plex Mono",monospace; font-size:.85rem;
            margin:1.5rem 0 .6rem; letter-spacing:.04em; }
  .scans { display:grid; grid-template-columns:repeat(auto-fill,minmax(15rem,1fr)); gap:.8rem; }
  .scan { text-align:left; background:var(--code); border:1px solid var(--line); border-radius:12px;
          padding:.85rem 1rem; color:var(--fg); cursor:pointer; font:inherit; margin:0; }
  .scan:hover, .scan.on { border-color:var(--accent); }
  .scan b { display:block; font-family:"Archivo",sans-serif; font-size:1rem; }
  .scan span { display:block; color:var(--muted); font-size:.85rem; line-height:1.5; }
  .bar { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin:1.4rem 0 .4rem; }
  .bar input { flex:1 1 14rem; max-width:22rem; padding:.55rem .7rem; font-size:.95rem; color:var(--fg);
               font-family:"IBM Plex Mono",ui-monospace,monospace; background:var(--code);
               border:1px solid var(--line); border-radius:8px; }
  .bar button { padding:.6rem 1.1rem; font-family:"Archivo",sans-serif; font-weight:700;
                text-transform:uppercase; letter-spacing:.03em; font-size:.8rem; color:var(--ink);
                background:var(--accent); border:1px solid var(--accent); border-radius:8px; cursor:pointer; }
  .bar .ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .bar .ghost:hover { border-color:var(--accent); }
  .dev { margin:1.6rem 0 .4rem; }
  .dev h3 { margin:0; font-family:"Archivo",sans-serif; }
  .dev p { margin:.1rem 0 .5rem; color:var(--muted); font-size:.85rem; font-family:"IBM Plex Mono",monospace; }
  .tablewrap { overflow-x:auto; }
  table.pts { width:100%; border-collapse:collapse; font-size:.88rem; }
  table.pts th, table.pts td { text-align:left; padding:.35rem .55rem; border-bottom:1px solid var(--line);
                               vertical-align:top; }
  table.pts th { font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.1em;
                 text-transform:uppercase; color:var(--accent); }
  table.pts td.v { font-family:"IBM Plex Mono",monospace; white-space:nowrap; }
  .net { background:var(--code); border:1px solid var(--line); border-radius:10px; padding:.6rem .9rem;
         font-family:"IBM Plex Mono",monospace; font-size:.85rem; margin:.8rem 0; }
  .lock { color:var(--muted); font-size:.85rem; margin-top:.9rem; }
  .hidden { display:none; }
  table.adm { width:100%; border-collapse:collapse; } table.adm td, table.adm th { padding:.35rem .5rem; border-bottom:1px solid var(--line); text-align:left; }
</style>
</head>
<body>

<header class="site">
  <a href="/" style="display:inline-flex;align-items:center;gap:.5rem;text-decoration:none"><img src="icon.svg" alt="" width="26" height="26" style="border-radius:6px"><span>Easy BACnet</span></a>
  <span class="muted">&middot; shared scans</span>
  <a class="getapp" href="https://play.google.com/store/apps/details?id=com.easybacnet.app&amp;utm_source=easybacnet.com&amp;utm_medium=nav&amp;utm_campaign=view" rel="noopener">Get the app</a>
</header>

<article>
  <h1>Shared codes (admin)</h1>
  <p>This list only shows codes made while the share server is in <b>open</b> mode.
  In private mode (the default) nobody, including us, can read shared scans, so they never appear here.</p>
  <div class="tool">
    <label for="tok">Admin token</label>
    <form class="codebox" id="f"><input id="tok" type="password" autocomplete="off" style="letter-spacing:0;text-transform:none;font-size:1rem"><button type="submit">Show</button></form>
    <p class="msg" id="msg"></p>
  </div>
  <div id="out"></div>
</article>
<script type="module">
const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
// ?api= is for local testing only; on easybacnet.com the server address is fixed.
const API = LOCAL ? (new URLSearchParams(location.search).get("api") || "http://127.0.0.1:8787") : "https://api.easybacnet.com";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
$("f").onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch(API + "/api/share/admin/folders", { headers: { Authorization: "Bearer " + $("tok").value }, cache: "no-store" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $("msg").textContent = j.error || "Not allowed."; return; }
  $("msg").textContent = "Server mode: " + j.mode + " · " + j.privateCount + " private codes (unreadable) · " + j.open.length + " open codes";
  $("out").innerHTML = '<table class="adm"><tr><th>Code</th><th>Scans</th><th>Last added</th><th>Deletes</th></tr>' +
    j.open.map((f) => `<tr><td><a href="view#${esc(f.code)}">${esc(f.code.slice(0,4) + "-" + f.code.slice(4))}</a></td><td>${esc(f.scan_count)}</td><td>${esc(new Date(f.updated).toLocaleString())}</td><td>${esc(new Date(f.expires).toLocaleString())}</td></tr>`).join("") + "</table>";
};
</script>
</body>
</html>
